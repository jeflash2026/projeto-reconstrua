# Site da RECONSTRUA CNH (2026-09-18) — estático. O NPM encaminha o domínio do
# site para esta porta; o HTTPS fica no NPM.
server {
  listen 3960;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/plain text/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # As páginas trazem https://DOMINIO/ (canonical, Open Graph, JSON-LD, robots e
  # sitemap): vira o domínio em que o site foi aberto, seja ele qual for.
  sub_filter 'https://DOMINIO/' 'https://$host/';
  sub_filter_once off;
  sub_filter_types text/plain text/xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Imagens e vídeo mudam pouco; páginas, CSS e JS revalidam a cada visita
  # (o config.js muda quando o número do WhatsApp muda).
  location /assets/img/ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ =404;
    error_page 404 = @inicio;
  }

  location @inicio {
    return 302 /;
  }
}
